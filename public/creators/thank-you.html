<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #FFFFFF;
  --ink: #231F20;
  --ink-60: rgba(35, 31, 32, 0.6);

body {

  min-height: 100vh;
  display: flex;
  align-items: center;

/* Soft warm wash on the page edges — Forge Creators uses cream tones */
.bg-warmth {
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse 80% 60% at 50% 100%, rgba(243, 201, 67, 0.08) 0%, transparent 60%);

.container {

  max-width: 560px;

  padding: 60px 24px;
  animation: fadeUp 0.55s cubic-bezier(0.22, 1, 0.36, 1);

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }

}

/* The 3-color brand stamp at the top — red / yellow / blue chips */
.brand-stamp {

.brand-stamp .chip {

.brand-stamp .chip.red    { background: var(--red); }

.brand-stamp .chip.blue   { background: var(--blue); }

<script>
(function() {
  // Where this page sends the applicant next. Also hardcoded as the href on
  // #manualLink and in the <meta http-equiv="refresh"> fallback in <head>, so
  // the escape hatch works even if this script never runs.
  var DEFAULT_NEXT = 'https://rzp.io/rzp/kBVXylt';
  var REDIRECT_DELAY_MS = 3000;

  // A `?next=` param may override the destination, but only to a host we have
  // a relationship with. Without this allowlist the page is an open redirect on
  // a domain we run paid traffic to, which is a phishing vector.
  var ALLOWED_HOSTS = ['razorpay.com', 'rzp.io', 'calendly.com', 'forgebylevelup.com'];

  function hostAllowed(host) {
    for (var i = 0; i < ALLOWED_HOSTS.length; i++) {
      var h = ALLOWED_HOSTS[i];
      if (host === h || host.slice(-(h.length + 1)) === '.' + h) return true;
    }
    return false;
  }

  function buildNextUrl() {
    var params = new URLSearchParams(window.location.search);
    var requested = params.get('next');
    var url = new URL(requested || DEFAULT_NEXT, window.location.href);
    if (url.protocol !== 'https:' || !hostAllowed(url.hostname)) {
      url = new URL(DEFAULT_NEXT);
    }
    params.forEach(function(value, key) {
      if (key !== 'next' && value) url.searchParams.set(key, value);
    });
    return url.toString();
  }

  // Never let a resolution failure leave us with no destination.
  var nextUrl = DEFAULT_NEXT;
  try { nextUrl = buildNextUrl() || DEFAULT_NEXT; } catch (e) {}

  // Upgrade the manual link. Markup already carries DEFAULT_NEXT, so this can
  // only improve the href, never blank it.
  try {
    var link = document.getElementById('manualLink');
    if (link) link.href = nextUrl;
  } catch (e) {}

  // Progress bar is cosmetic and must never be able to block the redirect.
  try {
    var fill = document.getElementById('progressFill');
    if (fill && window.requestAnimationFrame) {
      var startTime = performance.now();
      requestAnimationFrame(function tick(now) {
        var pct = Math.min(1, (now - startTime) / REDIRECT_DELAY_MS);
        fill.style.width = (pct * 100) + '%';
        if (pct < 1) requestAnimationFrame(tick);
      });
    }
  } catch (e) {}

  // Fires before the <meta refresh> fallback, so JS-enabled visitors get the
  // param-preserving URL and the pixels above still have time to send.
  setTimeout(function() { window.location.href = nextUrl; }, REDIRECT_DELAY_MS);
})();
</script>
